<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stopwatch Bot</title>
<!-- Bootstrap 5 (loads when hosted normally; fallback styles below cover the sandboxed preview) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1a2233;--muted:#6b7590;--accent:#2f6bff;--ok:#1f9d63;--warn:#e0a100;--track:#e3e8f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--text:#eef1f8;--muted:#98a3bd;--track:#26304a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--text:#eef1f8;--muted:#98a3bd;--track:#26304a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:460px}
.card{background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.10);text-align:center}
h1{font-size:1.15rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
#display{font-size:clamp(3rem,16vw,4.6rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.progress{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:16px 0}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.rounds{display:flex;gap:8px;justify-content:center;margin:14px 0 6px}
.dot{width:38px;height:38px;border-radius:50%;background:var(--track);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.dot.active{background:var(--accent);color:#fff}
.dot.done{background:var(--ok);color:#fff}
#status{min-height:1.4em;color:var(--muted);font-size:.95rem;margin:10px 0 18px}
#status.finished{color:var(--ok);font-weight:600}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 22px;font-size:1.05rem;font-weight:600;cursor:pointer;color:#fff;min-width:110px}
.btn-lg{padding:14px 30px}
.btn-success{background:var(--ok)}
.btn-warning{background:var(--warn);color:#1a1a1a}
.btn-outline-secondary{background:transparent;color:var(--muted);border:2px solid var(--track)}
.btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Stopwatch Bot</h1>
    <div class="sub">5 rounds &times; 20 minutes</div>

    <div id="display" aria-live="off">00:00</div>
    <div class="progress"><div class="progress-bar" id="bar"></div></div>

    <div class="rounds" id="rounds"></div>
    <div id="status">Press Start to begin round 1.</div>

    <div class="btns">
      <button class="btn btn-success btn-lg" id="startBtn">Start</button>
      <button class="btn btn-warning btn-lg" id="pauseBtn" disabled>Pause</button>
      <button class="btn btn-outline-secondary btn-lg" id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  var LIMIT = 20 * 60 * 1000;   // 20 minutes per round
  var TOTAL = 5;                // rounds per session

  var display = document.getElementById('display');
  var bar = document.getElementById('bar');
  var statusEl = document.getElementById('status');
  var roundsEl = document.getElementById('rounds');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var resetBtn = document.getElementById('resetBtn');

  var round = 1, elapsed = 0, startedAt = 0, timer = null, running = false, finished = false;

  // build round dots
  for (var i = 1; i <= TOTAL; i++) {
    var d = document.createElement('div');
    d.className = 'dot'; d.id = 'dot' + i; d.textContent = i;
    roundsEl.appendChild(d);
  }

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function beep(long) {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      var ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = long ? 660 : 880; g.gain.value = 0.15;
      o.start(); o.stop(ctx.currentTime + (long ? 1.2 : 0.4));
    } catch (e) {}
  }

  function render() {
    display.textContent = fmt(Math.min(elapsed, LIMIT));
    bar.style.width = Math.min(100, elapsed / LIMIT * 100) + '%';
    for (var i = 1; i <= TOTAL; i++) {
      var el = document.getElementById('dot' + i);
      el.className = 'dot' + (i < round || (finished && i <= TOTAL) ? ' done' : (i === round ? ' active' : ''));
    }
    document.title = fmt(elapsed) + ' · Round ' + Math.min(round, TOTAL) + '/' + TOTAL;
  }

  function tick() {
    elapsed = (performance.now() - startedAt) + base;
    if (elapsed >= LIMIT) {
      if (round >= TOTAL) { return finish(); }
      // next round: carry any overshoot so no time is lost
      var overshoot = elapsed - LIMIT;
      round++;
      base = overshoot; startedAt = performance.now(); elapsed = overshoot;
      beep(false);
      statusEl.textContent = 'Round ' + round + ' of ' + TOTAL + ' running…';
    }
    render();
  }

  var base = 0;

  function start() {
    if (running) return;
    if (finished) { reset(); }
    running = true;
    base = elapsed; startedAt = performance.now();
    timer = setInterval(tick, 200);
    startBtn.disabled = true; pauseBtn.disabled = false; pauseBtn.textContent = 'Pause';
    statusEl.className = '';
    statusEl.textContent = 'Round ' + round + ' of ' + TOTAL + ' running…';
  }

  function pause() {
    if (!running && !finished && elapsed > 0) {         // resume
      running = true; base = elapsed; startedAt = performance.now();
      timer = setInterval(tick, 200);
      pauseBtn.textContent = 'Pause';
      statusEl.textContent = 'Round ' + round + ' of ' + TOTAL + ' running…';
      return;
    }
    if (running) {
      clearInterval(timer); running = false;
      pauseBtn.textContent = 'Resume';
      statusEl.textContent = 'Paused.';
    }
  }

  function finish() {
    clearInterval(timer); running = false; finished = true;
    elapsed = LIMIT; render();
    beep(true);
    statusEl.className = 'finished';
    statusEl.textContent = 'All 5 rounds complete! Press Start to begin again.';
    startBtn.disabled = false; startBtn.textContent = 'Start';
    pauseBtn.disabled = true; pauseBtn.textContent = 'Pause';
  }

  function reset() {
    clearInterval(timer);
    running = false; finished = false; round = 1; elapsed = 0; base = 0;
    startBtn.disabled = false; pauseBtn.disabled = true; pauseBtn.textContent = 'Pause';
    statusEl.className = ''; statusEl.textContent = 'Press Start to begin round 1.';
    render();
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  render();
})();
</script>
</body>
</html>
